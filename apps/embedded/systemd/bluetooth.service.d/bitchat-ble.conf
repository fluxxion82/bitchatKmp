# Installed once, by hand, as /etc/systemd/system/bluetooth.service.d/bitchat-ble.conf (see
# apps/embedded/README.md, "Pairing prompts on iPhones"). deploy-pi.sh ships a copy in every release
# directory as bluetooth-bitchat-ble.conf and warns when the installed copy, or the bluetoothd actually
# running, differs from it.
#
# bitchat needs nothing from a peer but its own service, and Noise encrypts the payload, so a link is
# never encrypted or bonded. bluetoothd does not know that. On every LE link -- ours, which gattlib opens
# with Device1.Connect(), and a phone's to our GATT server -- its GATT client discovers the peer's whole
# database and hands each service it recognises to that service's profile plugin, which reads and
# subscribes. An iPhone protects some of those attributes and answers Insufficient Authentication;
# bluetoothd's ATT layer then raises the link's security by itself (change_security(), src/shared/att.c),
# the kernel sends SMP Pairing Request, and the phone shows a pairing dialog that can never succeed
# because no agent is registered here. Every reconnect repeats it.
#
# Discovery is harmless (declarations are never permission-checked) and the D-Bus API cannot narrow it.
# The plugins have to go: as of BlueZ 5.87 these are all the ones that read, write or subscribe to a
# peer's characteristics (bt_gatt_client_read_value/write_value/register_notify in profiles/ and
# src/shared/). Names a BlueZ build lacks are ignored. Nothing on this device uses them. Dropping the LE
# Audio ones also takes their services out of our own GATT database, where csip, bass and rap declare
# encrypted attributes. hostname, policy (adapter AutoEnable lives there), autopair, admin and the BR/EDR
# profiles stay.
#
# Debian and Armbian install bluetoothd as /usr/libexec/bluetooth/bluetoothd. Check
# `systemctl cat bluetooth.service` before installing: a wrong path here leaves Bluetooth down.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=gap,battery,deviceinfo,scanparam,midi,hog,bap,bass,ccp,csip,gmap,mcp,micp,tmap,vcp,asha,rap
