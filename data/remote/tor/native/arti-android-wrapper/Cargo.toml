[package]
name = "arti-android-wrapper"
version = "2.7.0"
edition = "2021"

[workspace]
# Empty workspace table to exclude from parent workspace

[lib]
crate-type = ["cdylib"]
name = "arti_android"

[dependencies]
# Arti library consumers must select a Rustls provider; keep the existing ring backend.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
arti-client = { path = "../arti/crates/arti-client", default-features = false, features = ["tokio", "rustls", "compression", "bridge-client", "onion-service-client", "static-sqlite"] }
tor-rtcompat = { path = "../arti/crates/tor-rtcompat", features = ["tokio", "rustls"] }
jni = "0.21"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization
strip = true        # Strip symbols
panic = "abort"     # Smaller panic handler
