[package]
name = "arti-desktop-wrapper"
version = "1.7.0"
edition = "2021"

[workspace]
# Empty workspace table to exclude from parent workspace

[lib]
# rlib alongside cdylib so the parsing and decoding logic can be unit tested; a cdylib alone has
# no test harness. It does not change what the cdylib contains.
crate-type = ["cdylib", "rlib"]
name = "arti_desktop"

[dependencies]
arti-client = { path = "../arti/crates/arti-client", default-features = false, features = ["tokio", "rustls", "compression", "bridge-client", "onion-service-client", "static-sqlite"] }
tor-rtcompat = { path = "../arti/crates/tor-rtcompat", features = ["tokio", "rustls"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
# NO jni crate - we use raw FFI types

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Unwind, not abort.
#
# These exports are called from the JVM. With panic = "abort" any panic anywhere in Arti -- a
# slice index, a failed assertion deep in a dependency -- terminates the whole process, taking
# Bluetooth and the mesh with it. Unwinding lets catch_unwind at each JNI entry point turn that
# into an error code instead. See guard_jni in src/lib.rs, and note the limits recorded there:
# this reduces the blast radius, it does not make the JVM immortal.
panic = "unwind"
