#Gradle
org.gradle.jvmargs=-Xmx12g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=6g
kotlin.daemon.jvmargs=-Xmx12g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=6g -XX:+HeapDumpOnOutOfMemoryError
kotlin.native.jvmArgs=-Xmx8g -XX:MaxMetaspaceSize=6g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.incremental=true
kotlin.incremental=true
kotlin.incremental.multiplatform=true
#Kotlin
kotlin.code.style=official
kotlin.native.binary.gc=cms
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Compose
compose.kotlin.native.manageCacheKind=false
#KMP
kotlin.native.disableCompilerDaemon=false
kotlin.native.binary.enableSafepointSignposts=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.js.webpack.major.version=4
org.jetbrains.compose.experimental.jcanvas.enabled=true

# Embedded (Orange Pi, linuxArm64) profile is opt-in. It adds the linuxArm64 target to the
# shared library modules, puts mavenLocal first for dependencies, swaps Compose/Koin/lifecycle
# for locally published forks (see docs/FORKED_LIBRARIES.md) and includes :apps:embedded.
# Enable per invocation:   ./gradlew -Pembedded.enabled=true :apps:embedded:linkDebugExecutableLinuxArm64
# or for this machine only: put embedded.enabled=true in ~/.gradle/gradle.properties
embedded.enabled=false
embedded.composeForkVersion=9999.0.0-SNAPSHOT
# Skiko is NOT forked any more: upstream skiko-linuxarm64 has bundled an EGL-only Skia since
# 0.9.47, so DirectContext.makeGL() is the EGL path. Resolved from Maven Central.
# Pinned at 0.9.47, the first EGL release: it is the last one that still has
# org.jetbrains.skiko.ClipboardManager/URIManager, which the Compose fork's
# PlatformClipboardManager/PlatformUriHandler call. See docs/FORKED_LIBRARIES.md.
embedded.skikoVersion=0.9.47
embedded.koinForkVersion=4.2.2
# Extra Kotlin/Native compiler arguments for the RELEASE binaries of the embedded profile: the
# :apps:embedded and :apps:embedded-tui executables and the :apps:embedded-canary release tests.
# -Xdisable-phases=ComputeTypes works around KT-88544 in Kotlin/Native 2.4.20: that pass ignored a
# local variable's writes followed by `continue` or `break`, and an optimized build then turned a
# call on the variable into `throw RuntimeException("Unexpected receiver type: ...")`. That crashed
# the release bitchat-embedded at startup (KeyboardInput.findKeyboardDevice, any time a keyboard
# was found). Fixed upstream by JetBrains/kotlin@7c0917898 (not in 2.4.21-RC). Remove this only
# on a Kotlin version that has the fix, and only after :apps:embedded-canary:hostReleaseTest
# passes without it (-Pembedded.kotlinNativeReleaseArgs=).
embedded.kotlinNativeReleaseArgs=-Xdisable-phases=ComputeTypes

# Desktop terminal UI profile (opt-in, per invocation via -Ptui.enabled=true; excludes embedded.enabled, never true here).
tui.enabled=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
