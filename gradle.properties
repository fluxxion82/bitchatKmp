#Gradle
org.gradle.jvmargs=-Xmx12g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=6g
kotlin.daemon.jvmargs=-Xmx12g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=6g -XX:+HeapDumpOnOutOfMemoryError
kotlin.native.jvmArgs=-Xmx8g -XX:MaxMetaspaceSize=6g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.incremental=true
kotlin.incremental=true
kotlin.incremental.multiplatform=true
#Kotlin
kotlin.code.style=official
kotlin.native.binary.gc=cms
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Compose
compose.kotlin.native.manageCacheKind=false
#KMP
kotlin.native.disableCompilerDaemon=false
kotlin.native.binary.enableSafepointSignposts=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.js.webpack.major.version=4
org.jetbrains.compose.experimental.jcanvas.enabled=true

# KT-88544: Kotlin/Native 2.4.20's ComputeTypes backend pass ignored a local var's writes that reach the
# loop condition only through `continue`, or the code after the loop only through `break`, and optimized
# code trusted the narrowed type ("Unexpected receiver type: kotlin.String"). On 2.4.20 the root build added
# -Xdisable-phases=ComputeTypes here to every release link for an Apple target. Kotlin 2.5.0-Beta1 carries the
# fix (JetBrains/kotlin 7c0917898): :apps:apple-canary passes its release tests without the flag, so it is off.
# The property and its wiring stay as the lever if the canary ever fails again.
apple.kotlinNativeReleaseArgs=

# Embedded (Orange Pi, linuxArm64) profile is opt-in. It adds the linuxArm64 target to the
# shared library modules, puts mavenLocal first for dependencies, swaps Compose/Koin/lifecycle
# for locally published forks (see docs/FORKED_LIBRARIES.md) and includes :apps:embedded.
# Enable per invocation:   ./gradlew -Pembedded.enabled=true :apps:embedded:linkDebugExecutableLinuxArm64
# or for this machine only: put embedded.enabled=true in ~/.gradle/gradle.properties
embedded.enabled=false
embedded.composeForkVersion=1.12.1-embedded-SNAPSHOT
embedded.material3ForkVersion=1.12.1-embedded-SNAPSHOT
embedded.lifecycleForkVersion=2.11.0-embedded-SNAPSHOT
embedded.savedstateForkVersion=1.5.0-alpha01-embedded-SNAPSHOT
embedded.navigationForkVersion=2.10.0-alpha05-embedded-SNAPSHOT
embedded.navigationEventForkVersion=1.1.1-embedded-SNAPSHOT
# Skiko is not forked: upstream skiko-linuxarm64 0.150.1 supplies the EGL path used by
# DirectContext.makeGL(). Resolved from Maven Central.
embedded.skikoVersion=0.150.1
embedded.koinForkVersion=4.2.2-embedded-SNAPSHOT
# Extra Kotlin/Native compiler arguments for the RELEASE binaries of the embedded profile: the
# :apps:embedded and :apps:embedded-tui executables and the :apps:embedded-canary release tests.
# On Kotlin/Native 2.4.20 this carried -Xdisable-phases=ComputeTypes to work around KT-88544: that pass
# ignored a local variable's writes followed by `continue` or `break`, and an optimized build then turned a
# call on the variable into `throw RuntimeException("Unexpected receiver type: ...")`, which crashed the
# release bitchat-embedded at startup (KeyboardInput.findKeyboardDevice). Kotlin 2.5.0-Beta1 carries the
# fix (JetBrains/kotlin@7c0917898) and :apps:embedded-canary:hostReleaseTest passes without the flag, so it
# is empty. The property stays as the lever; on-device proof is scripts/embedded-smoke.py after a deploy.
embedded.kotlinNativeReleaseArgs=

# Desktop terminal UI profile (opt-in, per invocation via -Ptui.enabled=true; excludes embedded.enabled, never true here).
tui.enabled=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
