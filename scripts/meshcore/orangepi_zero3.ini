# Fresh-install example only; preserve existing identity, credentials, and RF settings.
advert_name = "OrangePi Companion"
admin_password = "password"
lat = 0.0
lon = 0.0

# Orange Pi Zero 3 with RFM95W on SPI1.1
# gpiochip1 is the verified main GPIO controller on this Pi.
spidev = /dev/spidev1.1
gpio_chip = gpiochip1
lora_irq_pin = 70
# Software reset disabled: RESET reaches header 7 / PC9 (PMIC IRQ).
# Omit lora_reset_pin. Do not drive GPIO 71 or 73.
#lora_nss_pin =     # SS handled by spidev
#lora_busy_pin =    # SX1276 has no busy pin
#lora_rxen_pin =
#lora_txen_pin =

# MeshCore default radio parameters (matches official MeshCore phones)
lora_freq = 910.525
lora_bw = 62.5
lora_sf = 7
lora_cr = 5
lora_tx_power = 10
